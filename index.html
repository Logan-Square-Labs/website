<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Logan Square Labs</title>
  <style>
    :root {
      color-scheme: light dark;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      background: #f7f9fc;
      color: #0f172a;
    }

    main {
      text-align: center;
      padding: 2rem;
    }

    h1 {
      margin: 0 0 0.5rem;
      font-size: clamp(2rem, 5vw, 3rem);
    }

    p {
      margin: 0;
      font-size: 1.05rem;
      color: #334155;
    }
  </style>
</head>
<body>
  <main>
    <h1>Logan Square Labs</h1>
    <p>Exploring the landscape of intelligence.</p>
  </main>
</body>
</html>
